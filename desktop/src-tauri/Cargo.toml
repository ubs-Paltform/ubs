[package]
name = "ubs-desktop"
version = "3.11.1"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
description = "Lightweight desktop control surface for Universal Build Script"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
